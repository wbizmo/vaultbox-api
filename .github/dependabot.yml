version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 6
    groups:
      fastify:
        patterns:
          - fastify
          - "@fastify/*"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Africa/Lagos
    open-pull-requests-limit: 4
