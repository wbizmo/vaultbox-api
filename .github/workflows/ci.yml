name: VaultBox CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

# Cancel superseded SHA runs within the same event type. Draft synchronize
# events must never cancel an independently launched ready_for_review run.
concurrency:
  group: vaultbox-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action || 'push' }}
  cancel-in-progress: true

jobs:
  verify:
    # Review-ready PRs and all main pushes run the exact same verification.
    # Draft checkpoints remain locally verified to limit wasted Actions minutes.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://benchmark:benchmark@127.0.0.1:5432/benchmark
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Assert pinned Node.js runtime
        run: |
          expected="v$(tr -d '[:space:]' < .node-version)"
          actual="$(node --version)"
          echo "node ${actual} (expected ${expected}); npm $(npm --version)"
          test "$actual" = "$expected"

      - name: Initialize CodeQL extended security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Dependency security gate
        run: |
          set +e
          npm audit --audit-level=moderate --json > dependency-audit.json
          status=$?
          set -e
          cat dependency-audit.json
          exit $status

      - name: Render Free install/startup compatibility regressions
        run: node --test test/render-free-compatibility.test.js

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run deploy:generate

      - name: Apply committed migrations on isolated CI Postgres 16
        run: npm run deploy:migrate

      - name: Typecheck generated Prisma contracts and checked JavaScript
        run: npm run typecheck

      - name: Build deployable Node API (Prisma runtime and module smoke)
        run: npm run build | tee build-verification.log

      - name: Syntax check
        run: find src scripts test prisma -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint
        run: npm run lint

      - name: Static credential and secret security scan
        run: npm run security:scan

      - name: Full unit, integration, BOLA, crash and multipart fault suite
        run: |
          set -euo pipefail
          # Remove potentially sensitive raw logs even when redaction fails.
          trap 'rm -f test-output.raw.log' EXIT
          set +e
          npm test -- --experimental-test-coverage > test-output.raw.log 2>&1
          code=$?
          set -e
          node scripts/redact-test-artifacts.js test-output.raw.log test-output.redacted.log
          cat test-output.redacted.log
          exit "$code"

      - name: Explicit independent-process and malformed multipart regression gate
        run: |
          node --test test/distributed-fault-gates.integration.test.js
          # Both files use process-external PostgreSQL temporary-claim counters.
          # The repository's normal npm test gate runs one test file at a time;
          # match that isolation here to avoid cross-file budget interference.
          node --test --test-concurrency=1 test/temporary-storage.integration.test.js test/multipart-fuzz.integration.test.js

      - name: Ten-thousand-session cleanup backlog and two-worker gate
        env:
          VAULTBOX_RUN_LARGE_CLEANUP_TEST: "true"
        run: node --test test/upload-cleanup-worker.integration.test.js

      - name: Benchmark
        run: |
          set -euo pipefail
          npm run benchmark | tee benchmark.json

      - name: Real HTTP transfer and database benchmark
        run: |
          set -euo pipefail
          npm run benchmark:transfers | tee transfer-benchmark.json

      - name: PostgreSQL query plans and optional count benchmark
        env:
          VAULTBOX_QUERY_PROFILE_ALLOW_WRITES: "1"
        run: |
          set -euo pipefail
          npm run benchmark:queries | tee query-benchmark.json

      # CodeQL security-extended runs on this same runner, not a second job.
      - name: Analyze CodeQL findings
        uses: github/codeql-action/analyze@v4

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vaultbox-engineering-evidence
          path: |
            benchmark.json
            transfer-benchmark.json
            query-benchmark.json
            dependency-audit.json
            test-output.redacted.log
            build-verification.log
          retention-days: 30
