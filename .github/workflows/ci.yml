name: VaultBox CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    # Draft PR checkpoints are validated in the local VM, not billed GitHub runners.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://benchmark:benchmark@127.0.0.1:5432/benchmark
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Assert pinned Node.js runtime
        run: |
          expected="v$(tr -d '[:space:]' < .node-version)"
          actual="$(node --version)"
          echo "node ${actual} (expected ${expected}); npm $(npm --version)"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: |
          set +e
          npm audit --audit-level=high --json > dependency-audit.json
          status=$?
          set -e
          cat dependency-audit.json
          exit $status

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Syntax check
        run: find src scripts test prisma -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint
        run: npm run lint

      - name: Static credential and secret security scan
        run: npm run security:scan

      - name: Full unit, integration, BOLA, crash and multipart fault suite
        run: |
          set +e
          npm test > test-output.raw.log 2>&1
          code=$?
          set -e
          node scripts/redact-test-artifacts.js test-output.raw.log test-output.redacted.log
          cat test-output.redacted.log
          rm -f test-output.raw.log
          exit "$code"

      - name: Explicit independent-process and malformed multipart regression gate
        run: |
          node --test test/distributed-fault-gates.integration.test.js
          node --test test/temporary-storage.integration.test.js test/multipart-fuzz.integration.test.js

      - name: Ten-thousand-session cleanup backlog and two-worker gate
        env:
          VAULTBOX_RUN_LARGE_CLEANUP_TEST: "true"
        run: node --test test/upload-cleanup-worker.integration.test.js

      - name: Benchmark
        run: npm run benchmark | tee benchmark.json

      - name: Real HTTP transfer and database benchmark
        run: npm run benchmark:transfers | tee transfer-benchmark.json

      - name: PostgreSQL query plans and optional count benchmark
        run: npm run benchmark:queries | tee query-benchmark.json

      # CodeQL is deliberately on the SAME runner as the complete local-
      # equivalent quality gate, to avoid an extra paid runner. Draft PRs skip
      # this entire job until the owner authorizes review-ready CI.
      - name: Initialize CodeQL extended security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze CodeQL findings
        uses: github/codeql-action/analyze@v4

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vaultbox-engineering-evidence
          path: |
            benchmark.json
            transfer-benchmark.json
            query-benchmark.json
            dependency-audit.json
            test-output.redacted.log
          retention-days: 30
