name: Publish release (explicit approval only)

# Never publish from a push, PR or the presence of release notes alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable package version (e.g., 2.5.0)
        required: true
        type: string
      release_sha:
        description: Full 40-character main SHA with successful completed CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vaultbox-intentional-release
  cancel-in-progress: false

jobs:
  release:
    # Configure required environment reviewers in GitHub repository settings.
    if: github.repository == 'wbizmo/vaultbox-api'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: vaultbox-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Use pinned Node runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Verify main, version, release notes, and exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$RELEASE_SHA" --limit 100 \
            --json headSha,headBranch,event,status,conclusion > /tmp/vaultbox-ci-runs.json
          node scripts/verify-release-gate.js \
            --version="$RELEASE_VERSION" --sha="$RELEASE_SHA" \
            --main-sha="$main_sha" --runs=/tmp/vaultbox-ci-runs.json
          echo "Validated release v$RELEASE_VERSION at $RELEASE_SHA"

      - name: Publish only the validated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          # Refuse if main moved after the exact-SHA gate ran.
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::main moved since verification"
            exit 1
          fi
          notes="docs/RELEASE_NOTES_$tag.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to republish"
            exit 1
          fi
          # Checkout deliberately uses persist-credentials=false. This
          # unauthenticated ls-remote requires the repository to stay public;
          # private repositories need an approved short-lived read token.
          refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          tag_sha="$(printf '%s\n' "$refs" | awk -v t="refs/tags/$tag^{}" '$2==t{print $1}')"
          if [ -z "$tag_sha" ]; then
            tag_sha="$(printf '%s\n' "$refs" | awk -v t="refs/tags/$tag" '$2==t{print $1}')"
          fi
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Tag points to $tag_sha, not the verified $RELEASE_SHA"
            exit 1
          fi
          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" --title "$title" --notes-file "$notes"
