name: Publish VaultBox v2.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish v2.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.0 already exists; leaving the existing release untouched."
            exit 0
          fi

          gh release create v2.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VaultBox API v2.1.0 — Resumable Upload & Efficiency Release" \
            --notes-file docs/RELEASE_NOTES_v2.1.0.md
